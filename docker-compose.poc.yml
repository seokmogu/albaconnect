services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: albaconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - poc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d albaconnect"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-16379}:6379"
    volumes:
      - poc_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/albaconnect
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: production
      WEB_URL: ${POC_WEB_PUBLIC_URL:?Set POC_WEB_PUBLIC_URL in .env.poc}
      JWT_SECRET: ${JWT_SECRET:-change-this-poc-jwt-secret-minimum-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-poc-refresh-secret-min-32-chars}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-this-poc-admin-token}
      TOSS_CLIENT_MODE: ${TOSS_CLIENT_MODE:-mock}
      TOSS_ALLOW_MOCK_CLIENT: ${TOSS_ALLOW_MOCK_CLIENT:-true}
      TOSS_ALLOW_TEST_KEYS: ${TOSS_ALLOW_TEST_KEYS:-true}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_sk_poc_mock}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-test_ck_poc_mock}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET:-poc-webhook-secret}
      TOSS_MOCK_PAYMENT_STATUS: ${TOSS_MOCK_PAYMENT_STATUS:-DONE}
      TOSS_MOCK_TOTAL_AMOUNT: ${TOSS_MOCK_TOTAL_AMOUNT:-55000}
      PAYOUT_RELEASE_MODE: ${PAYOUT_RELEASE_MODE:-manual}
      KAKAO_BIZ_API_KEY: ${KAKAO_BIZ_API_KEY:-}
      KAKAO_SENDER_KEY: ${KAKAO_SENDER_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@example.local}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${POC_API_PUBLIC_URL:?Set POC_API_PUBLIC_URL in .env.poc}
        NEXT_PUBLIC_SITE_URL: ${POC_WEB_PUBLIC_URL:?Set POC_WEB_PUBLIC_URL in .env.poc}
        NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${NEXT_PUBLIC_KAKAO_MAP_API_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${POC_API_PUBLIC_URL:?Set POC_API_PUBLIC_URL in .env.poc}
      NEXT_PUBLIC_SITE_URL: ${POC_WEB_PUBLIC_URL:?Set POC_WEB_PUBLIC_URL in .env.poc}
      NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${NEXT_PUBLIC_KAKAO_MAP_API_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  poc_pgdata:
  poc_redisdata:
