# fly.toml — AlbaConnect Web (Next.js standalone)
# Deploy from monorepo root: flyctl deploy --config apps/web/fly.toml
app = "albaconnect-web"
primary_region = "nrt"  # Tokyo — closest to Korean market

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  # NEXT_PUBLIC_API_URL must be set via: fly secrets set NEXT_PUBLIC_API_URL=https://albaconnect-api.fly.dev

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    port = 3000
    timeout = "5s"
    type = "http"
